/* токены (светлая тема) */
:root {
  --space-x1: 4px;
  --space-x2: 8px;
  --finex-ff-main: 'Noto Sans', Arial, sans-serif;
  --finex-fz-xs-paragraph-md: 12px;
  --finex-fz-s-paragraph-md: 14px;
  --finex-lh-s-paragraph-md: 20px;
  --finex-bg-primary: #ffffff;
  --finex-bg-secondary: #f5f7fa;
  --finex-text-primary: #111928;
  --finex-text-secondary: #62697a;
  --finex-border-primary: #bac0cd;
  --finex-border-tertiary: #e3e7ed;
  --finex-link-default: #2581e5;
  --finex-outline: #3c95fb;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--finex-bg-secondary);
  font-family: var(--finex-ff-main);
  color: var(--finex-text-primary);
}

.page { max-width: 528px; margin: 0 auto; padding: 24px 16px; }
.card { display: flex; flex-direction: column; gap: 24px; padding: 24px; border-radius: 16px; background: var(--finex-bg-primary); }
.card__title { margin: 0; font-size: 18px; line-height: 24px; font-weight: 500; }
.req { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 16px; border-radius: 8px; background: var(--finex-bg-secondary); }
.req div { display: flex; justify-content: space-between; gap: 16px; }
.req dt { color: var(--finex-text-secondary); font-size: 14px; }
.req dd { margin: 0; font-size: 14px; font-weight: 500; text-align: right; }

/* плитки банков */
.bank-tiles {
  display: flex;
  flex-direction: column;
  gap: var(--space-x2);
  min-width: 0;
  margin-bottom: calc(var(--space-x1) * -1);
}
.bank-tiles[hidden] { display: none; }

.tiles-label {
  font-size: var(--finex-fz-xs-paragraph-md);
  line-height: 16px;
  color: var(--finex-text-secondary);
}

/* мобильный: одна строка, горизонтальная прокрутка, затухание правого края */
.tiles-scroll { position: relative; }
.tiles-scroll::after {
  content: '';
  position: absolute;
  inset-block: 0;
  inset-inline-end: 0;
  width: 36px;
  background: linear-gradient(to right, rgba(255, 255, 255, 0), var(--finex-bg-primary));
  pointer-events: none;
}

.tiles {
  display: flex;
  gap: var(--space-x2);
  padding-inline-end: 36px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tiles::-webkit-scrollbar { display: none; }

.tile {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 10px 9px 8px;
  border: 1px solid var(--finex-border-tertiary);
  border-radius: 8px;
  background: var(--finex-bg-primary);
  font-family: var(--finex-ff-main);
  font-size: var(--finex-fz-s-paragraph-md);
  line-height: var(--finex-lh-s-paragraph-md);
  color: var(--finex-text-primary);
  white-space: nowrap;
  cursor: pointer;
}
.tile:hover:not(.tile--selected) { border-color: var(--finex-border-primary); }
.tile--selected {
  border-color: var(--finex-link-default);
  box-shadow: inset 0 0 0 1px var(--finex-link-default);
}
.tile:focus-visible {
  outline: 2px solid var(--finex-outline);
  outline-offset: 2px;
}

.tile__logo { flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px; }
.tile__name { overflow: hidden; text-overflow: ellipsis; }

/* десктоп: breakpoint(md) = 768px */
@media only screen and (min-width: 768px) {
  .tiles-scroll::after { display: none; }
  .tiles { padding-inline-end: 0; overflow: visible; }
  .tile { flex: 1 1 0; min-width: 0; padding: 10px 6px; }
}
</style>

    { bank: 'bni', aliases: ['bni', 'negara indonesia'] },
    { bank: 'mandiri', aliases: ['mandiri'] },
    { bank: 'cimb', aliases: ['cimb'] },
    { bank: 'bri', aliases: ['bri', 'rakyat indonesia'] }
  ];
  function matchFinexBank(bankName) {
    var name = (bankName || '').toLowerCase();
    if (!name) return null;
    var words = name.split(/[^a-z]+/);
    for (var i = 0; i < ALIASES.length; i++) {
      var hit = ALIASES[i].aliases.some(function (a) {
        return a.indexOf(' ') !== -1 ? name.indexOf(a) !== -1 : words.indexOf(a) !== -1;
      });
      if (hit) return ALIASES[i].bank;
    }
    return null;
  }

  var params = new URLSearchParams(location.search);
  var matched = matchFinexBank(params.get('client') || 'Bank Permata');
  var initial = params.get('bank');
  var selected = matched || (BANKS.some(function (b) { return b.bank === initial; }) ? initial : 'bca');

  var tilesEl = document.getElementById('tiles');
  document.getElementById('bank-tiles').hidden = !!matched;

  var buttons = BANKS.map(function (item) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tile';
    btn.setAttribute('role', 'radio');
    btn.innerHTML = '<img alt="" class="tile__logo" height="24" width="24" src="' + item.logo + '" />' +
      '<span class="tile__name">' + item.shortName + '</span>';
    btn.addEventListener('click', function () { select(item.bank); });
    tilesEl.appendChild(btn);
    return btn;
  });

  function select(bank) {
    selected = bank;
    BANKS.forEach(function (item, i) {
      var on = item.bank === bank;
      buttons[i].classList.toggle('tile--selected', on);
      buttons[i].setAttribute('aria-checked', String(on));
    });
    var cur = BANKS.filter(function (b) { return b.bank === bank; })[0];
    document.getElementById('req-bank').textContent = cur.shortName;
    document.getElementById('req-account').textContent = cur.account;
    document.getElementById('req-holder').textContent = HOLDER;
  }

  select(selected);
})();
</script>
</body>
</html>
